name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && node --test
      - run: cd web && node build.js
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: web/dist

  deploy:
    # Publishes web/dist to GitHub Pages. configure-pages enables Pages with
    # source "GitHub Actions" on first run; the repo must be public on a free plan.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && CRICKET_BUILD="${GITHUB_SHA::7}" node build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
